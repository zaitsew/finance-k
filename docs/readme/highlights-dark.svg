<rect x="322.0" y="39" width="8" height="8" rx="2.5" fill="#52C4A8"/>
<text class="cap b" x="336.0" y="48" font-size="12" style="fill:#52C4A8;letter-spacing:.07em">CLOSE</text>
<text class="b" x="322.0" y="74" font-size="16.5">Close the month in one</text>
<text class="b" x="322.0" y="95" font-size="16.5">screen</text>
<text class="m" x="322.0" y="118" font-size="13.5">Last balances prefilled; saving twice</text>
<text class="m" x="322.0" y="137" font-size="13.5">adds no row.</text>
<rect x="588.0" y="20" width="272.0" height="137" rx="10" fill="#1D2029"/>
<rect x="606.0" y="39" width="8" height="8" rx="2.5" fill="#52C4A8"/>
<text class="cap b" x="620.0" y="48" font-size="12" style="fill:#52C4A8;letter-spacing:.07em">NET WORTH</text>
<text class="b" x="606.0" y="74" font-size="16.5">Change split three ways</text>
<text class="m" x="606.0" y="97" font-size="13.5">Flows, market moves and FX, in</text>
<text class="m" x="606.0" y="116" font-size="13.5">EUR.</text>
<rect x="20.0" y="169" width="272.0" height="137" rx="10" fill="#1D2029"/>
<rect x="38.0" y="188" width="8" height="8" rx="2.5" fill="#52C4A8"/>
<text class="cap b" x="52.0" y="197" font-size="12" style="fill:#52C4A8;letter-spacing:.07em">RATES</text>
<text class="b" x="38.0" y="223" font-size="16.5">ECB, Bank of Russia,</text>
<text class="b" x="38.0" y="244" font-size="16.5">CoinGecko</text>
<text class="m" x="38.0" y="267" font-size="13.5">Fetched when you ask, cached by</text>
<text class="m" x="38.0" y="286" font-size="13.5">date.</text>
<rect x="304.0" y="169" width="272.0" height="137" rx="10" fill="#1D2029"/>
<rect x="322.0" y="188" width="8" height="8" rx="2.5" fill="#52C4A8"/>
<text class="cap b" x="336.0" y="197" font-size="12" style="fill:#52C4A8;letter-spacing:.07em">MONTHLY</text>
<text class="b" x="322.0" y="223" font-size="16.5">Dormant and new accounts</text>
<text class="m" x="322.0" y="246" font-size="13.5">Unclosed accounts never count as</text>
<text class="m" x="322.0" y="265" font-size="13.5">zero.</text>
<rect x="588.0" y="169" width="272.0" height="137" rx="10" fill="#1D2029"/>
<rect x="606.0" y="188" width="8" height="8" rx="2.5" fill="#52C4A8"/>
<text class="cap b" x="620.0" y="197" font-size="12" style="fill:#52C4A8;letter-spacing:.07em">LOCAL</text>
<text class="b" x="606.0" y="223" font-size="16.5">Ask Claude or Codex</text>
