<svg xmlns="http://www.w3.org/2000/svg" width="880" height="326" viewBox="0 0 880 326" role="img" aria-label="Highlights. REGISTRY: Every account in one list. Bank, broker, exchange, wallet, cash, pension. CLOSE: Close the month in one screen. Last balances prefilled; saving twice adds no row. NET WORTH: Change split three ways. Flows, market moves and FX, in EUR. RATES: ECB, Bank of Russia, CoinGecko. Fetched when you ask, cached by date. MONTHLY: Dormant and new accounts. Unclosed accounts never count as zero. LOCAL: Ask Claude or Codex. Read-only MCP server over the same file.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#ECEDF2}.m{fill:#A2A7B5}.cap{font-size:11px;letter-spacing:.06em}.b{font-weight:600}</style>
<rect x="0.5" y="0.5" width="879" height="325" rx="12" fill="#171A21" stroke="#2B2F3A"/>
<rect x="20.0" y="20" width="272.0" height="137" rx="10" fill="#1D2029"/>
<rect x="38.0" y="39" width="8" height="8" rx="2.5" fill="#52C4A8"/>
<text class="cap b" x="52.0" y="48" font-size="12" style="fill:#52C4A8;letter-spacing:.07em">REGISTRY</text>
<text class="b" x="38.0" y="74" font-size="16.5">Every account in one list</text>
<text class="m" x="38.0" y="97" font-size="13.5">Bank, broker, exchange, wallet, cash,</text>
<text class="m" x="38.0" y="116" font-size="13.5">pension.</text>
