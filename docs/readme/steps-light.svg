<svg xmlns="http://www.w3.org/2000/svg" width="880" height="189" viewBox="0 0 880 189" role="img" aria-label="How it works. 1. Add accounts. Institution, positions, currencies. 2. Close the month. Enter balances; last values prefilled. 3. Fetch rates. ECB, Bank of Russia, CoinGecko. 4. Read the summary. Net worth and what moved it. 5. Ask your agent. Read-only MCP over the file.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#14161D}.m{fill:#585E6D}.cap{font-size:11px;letter-spacing:.06em}.b{font-weight:600}</style>
<rect x="0.5" y="0.5" width="879" height="188" rx="12" fill="#FFFFFF" stroke="#DCDEE5"/>
<line x1="90.0" x2="190.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="60.0" cy="52" r="20" fill="#0F6B5C"/>
<text class="b" x="60.0" y="58" font-size="17" text-anchor="middle" style="fill:#FFFFFF">1</text>
<text class="b" x="40.0" y="98" font-size="15.5">Add accounts</text>
<text class="m" x="40.0" y="120" font-size="13.5">Institution, positions,</text>
<text class="m" x="40.0" y="139" font-size="13.5">currencies.</text>
<line x1="250.0" x2="350.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="220.0" cy="52" r="20" fill="#0F6B5C"/>
<text class="b" x="220.0" y="58" font-size="17" text-anchor="middle" style="fill:#FFFFFF">2</text>
<text class="b" x="200.0" y="98" font-size="15.5">Close the month</text>
<text class="m" x="200.0" y="120" font-size="13.5">Enter balances; last</text>
<text class="m" x="200.0" y="139" font-size="13.5">values prefilled.</text>
<line x1="410.0" x2="510.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="380.0" cy="52" r="20" fill="#0F6B5C"/>
<text class="b" x="380.0" y="58" font-size="17" text-anchor="middle" style="fill:#FFFFFF">3</text>
<text class="b" x="360.0" y="98" font-size="15.5">Fetch rates</text>
<text class="m" x="360.0" y="120" font-size="13.5">ECB, Bank of Russia,</text>
<text class="m" x="360.0" y="139" font-size="13.5">CoinGecko.</text>
<line x1="570.0" x2="670.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="540.0" cy="52" r="20" fill="#0F6B5C"/>
<text class="b" x="540.0" y="58" font-size="17" text-anchor="middle" style="fill:#FFFFFF">4</text>
<text class="b" x="520.0" y="98" font-size="15.5">Read the</text>
<text class="b" x="520.0" y="118" font-size="15.5">summary</text>
<text class="m" x="520.0" y="140" font-size="13.5">Net worth and what</text>
<text class="m" x="520.0" y="159" font-size="13.5">moved it.</text>
<circle cx="700.0" cy="52" r="20" fill="#0F6B5C"/>
<text class="b" x="700.0" y="58" font-size="17" text-anchor="middle" style="fill:#FFFFFF">5</text>
<text class="b" x="680.0" y="98" font-size="15.5">Ask your agent</text>
<text class="m" x="680.0" y="120" font-size="13.5">Read-only MCP over</text>
<text class="m" x="680.0" y="139" font-size="13.5">the file.</text>
</svg>
